name: e2e tests

on:
  workflow_dispatch: # Disabled until Cypress tests are updated for Angular 21
  # pull_request:
  #   paths-ignore:
  #     - src/**/*.stories.ts
  #     - src/**/*.stories.spec.ts
  #     - test/**/*.cs
  #     - docs
  #     - docs-project
  #     - scripts

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup local certificate
        run: ./scripts/generate-local-cert.sh
      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            ./src/livestock-tracker/ClientApp/package-lock.json
            ./test/e2e/package-lock.json
      - name: Install packages
        run: npm ci
        working-directory: ./src/livestock-tracker/ClientApp
      - name: Copy static files
        run: ./copy-assets.sh
        working-directory: ./src/livestock-tracker/ClientApp/scripts
      - name: Cypress run
        uses: cypress-io/github-action@v2
        with:
          command: npm run ci
          working-directory: ./test/e2e
